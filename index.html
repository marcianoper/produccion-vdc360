<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Producción VDC 360°</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
    .bloque { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 10px #ccc; }
    label { display: block; margin-top: 10px; }
    input { padding: 6px; width: 100%; margin-top: 4px; }
    button { background: green; color: white; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
    h2 { color: darkgreen; }
  </style>
</head>
<body>

<h1>Formulario Producción VDC 360°</h1>

<!-- Apertura de Camión -->
<div class="bloque">
  <h2>Apertura de Camión</h2>
  <label>Hora de apertura: <input type="time" id="hora_apertura"></label>
  <button onclick="guardarEventoGeneral('apertura_camion', 'Apertura de Camión')">📤 Guardar y Enviar</button>
</div>

<!-- Registro de Patas -->
<div class="bloque">
  <h2>Registro de Patas</h2>
  <label>Hora de envío a limpieza: <input type="time" id="hora_envio_patas"></label>
  <label>Hora de llegada de limpieza: <input type="time" id="hora_llegada_patas"></label>
  <button onclick="guardarPatas()">📤 Guardar y Enviar</button>
</div>

<!-- Líneas de Producción -->
<div id="lineas"></div>

<!-- Botón para generar resumen -->
<button onclick="generarResumen()" style="background: navy;">📄 Generar Documento Resumen</button>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://uixxrniebjfsxgouqlzh.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpeHhybmllYmpmc3hnb3VxbHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU4Njg4NzYsImV4cCI6MjA3MTQ0NDg3Nn0.Rds7LA448PbyVfEfKC-lT47YgRwNR3Hl12z0To_z-dg'
);

const lineas = [
  { id: 'l1', nombre: 'Línea 1 - Bofe y Corazón' },
  { id: 'l2', nombre: 'Línea 2 - Teleco' },
  { id: 'l3', nombre: 'Línea 3 - Cuajo' },
  { id: 'l4', nombre: 'Línea 4 - Libro' },
  { id: 'l5', nombre: 'Línea 5 - Menudo' },
  { id: 'l6', nombre: 'Línea 6 - Patas Sucias' }
];

const contenedor = document.getElementById("lineas");
contenedor.innerHTML = lineas.map(({ id, nombre }) => `
  <div class="bloque">
    <h2>${nombre}</h2>
    <label>Inicio: <input type="time" id="${id}_inicio"></label>
    <label>Responsable: <input type="text" id="${id}_responsable"></label>
    <button onclick="guardarYenviar('${id}', 'inicio', '${nombre}')">📤 Enviar Inicio</button>
    <label>Término: <input type="time" id="${id}_fin"></label>
    <button onclick="guardarYenviar('${id}', 'fin', '${nombre}')">📤 Enviar Término</button>
  </div>
`).join('');

window.guardarYenviar = async function(linea, tipo, nombreLinea) {
  const inicio = document.getElementById(`${linea}_inicio`).value;
  const fin = document.getElementById(`${linea}_fin`).value;
  const responsable = document.getElementById(`${linea}_responsable`).value;
  const registro = {
    linea: nombreLinea,
    inicio: inicio || null,
    fin: fin || null,
    responsable: responsable || null,
    momento: tipo
  };
  const { error } = await supabase.from("produccion_camion").insert([registro]);
  if (error) return alert("Error al guardar: " + error.message);

  let mensaje = tipo === 'inicio'
    ? `🚀 *${nombreLinea}*\n🕒 Inicio: ${inicio}\n👤 Responsable: ${responsable}`
    : `✅ *${nombreLinea}*\n🕒 Término: ${fin}`;

  abrirWhatsApp(mensaje);
}

window.guardarEventoGeneral = async function(idCampo, nombreEvento) {
  const hora = document.getElementById(`hora_apertura`).value;
  const { error } = await supabase.from("produccion_camion").insert([{ linea: nombreEvento, inicio: hora, momento: 'inicio' }]);
  if (error) return alert("Error: " + error.message);
  abrirWhatsApp(`🚛 *${nombreEvento}*\n🕒 Hora: ${hora}`);
}

window.guardarPatas = async function() {
  const envio = document.getElementById("hora_envio_patas").value;
  const llegada = document.getElementById("hora_llegada_patas").value;
  const { error } = await supabase.from("produccion_camion").insert([
    { linea: 'Envío Patas', inicio: envio, momento: 'envio_patas' },
    { linea: 'Llegada Patas', inicio: llegada, momento: 'llegada_patas' }
  ]);
  if (error) return alert("Error al guardar patas: " + error.message);
  abrirWhatsApp(`🐾 *Patas Enviadas:* ${envio}\n🐾 *Patas Llegaron:* ${llegada}`);
}

window.generarResumen = async function() {
  const { data, error } = await supabase.from("produccion_camion").select("*").order("created_at", { ascending: true });
  if (error) return alert("Error generando resumen");
  const texto = data.map(row => `🟩 ${row.linea} - ${row.momento}\n🕒 ${row.inicio || row.fin || ''} ${row.responsable ? '\n👤 ' + row.responsable : ''}`).join("\n\n");
  const blob = new Blob([texto], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Resumen_Produccion_VDC360.txt";
  link.click();
  URL.revokeObjectURL(url);
}

function abrirWhatsApp(mensaje) {
  const numero = "524621872594";
  const url = `https://wa.me/${+524621872594}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
}
</script>

</body>
</html>
