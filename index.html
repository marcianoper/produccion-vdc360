<!DOCTYPE html>

<head>

  <title>Producción VDC 360°</title>

</head>

  <button onclick="guardarEventoGeneral('hora_apertura', 'Apertura de Camión')">
    📤 Guardar y Enviar
  </button>
</div>

  </label>

  </button>
</div>
