<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Producción VDC 360°</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
    .bloque { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 10px #ccc; }
    label { display: block; margin-top: 10px; }
    input { padding: 6px; width: 100%; margin-top: 4px; }
    button { background: green; color: white; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
    h2 { color: darkgreen; }
  </style>
</head>
<body>

  <h1>Formulario Producción VDC 360°</h1>

  <div class="bloque">
    <h2>Línea 1 - Bofe y Corazón</h2>
    <label>Inicio: <input type="time" id="l1_inicio"></label>
    <label>Responsable: <input type="text" id="l1_responsable"></label>
    <button onclick="guardarYenviar('l1', 'inicio', 'Línea 1 - Bofe y Corazón')">📤 Enviar Inicio</button>
    <label>Término: <input type="time" id="l1_fin"></label>
    <button onclick="guardarYenviar('l1', 'fin', 'Línea 1 - Bofe y Corazón')">📤 Enviar Término</button>
  </div>

  <div class="bloque">
    <h2>Línea 2 - Teleco</h2>
    <label>Inicio: <input type="time" id="l2_inicio"></label>
    <label>Responsable: <input type="text" id="l2_responsable"></label>
    <button onclick="guardarYenviar('l2', 'inicio', 'Línea 2 - Teleco')">📤 Enviar Inicio</button>
    <label>Término: <input type="time" id="l2_fin"></label>
    <button onclick="guardarYenviar('l2', 'fin', 'Línea 2 - Teleco')">📤 Enviar Término</button>
  </div>

  <div class="bloque">
    <h2>Línea 3 - Cuajo</h2>
    <label>Inicio: <input type="time" id="l3_inicio"></label>
    <label>Responsable: <input type="text" id="l3_responsable"></label>
    <button onclick="guardarYenviar('l3', 'inicio', 'Línea 3 - Cuajo')">📤 Enviar Inicio</button>
    <label>Término: <input type="time" id="l3_fin"></label>
    <button onclick="guardarYenviar('l3', 'fin', 'Línea 3 - Cuajo')">📤 Enviar Término</button>
  </div>

  <div class="bloque">
    <h2>Línea 4 - Libro</h2>
    <label>Inicio: <input type="time" id="l4_inicio"></label>
    <label>Responsable: <input type="text" id="l4_responsable"></label>
    <button onclick="guardarYenviar('l4', 'inicio', 'Línea 4 - Libro')">📤 Enviar Inicio</button>
    <label>Término: <input type="time" id="l4_fin"></label>
    <button onclick="guardarYenviar('l4', 'fin', 'Línea 4 - Libro')">📤 Enviar Término</button>
  </div>

  <div class="bloque">
    <h2>Línea 5 - Menudo</h2>
    <label>Inicio: <input type="time" id="l5_inicio"></label>
    <label>Responsable: <input type="text" id="l5_responsable"></label>
    <button onclick="guardarYenviar('l5', 'inicio', 'Línea 5 - Menudo')">📤 Enviar Inicio</button>
    <label>Término: <input type="time" id="l5_fin"></label>
    <button onclick="guardarYenviar('l5', 'fin', 'Línea 5 - Menudo')">📤 Enviar Término</button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient(
      'https://uixxrniebjfsxgouqlzh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpeHhybmllYmpmc3hnb3VxbHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU4Njg4NzYsImV4cCI6MjA3MTQ0NDg3Nn0.Rds7LA448PbyVfEfKC-lT47YgRwNR3Hl12z0To_z-dg'
    );

    function abrirWhatsApp(mensaje) {
      const numero = "524621872594"; // sin +
      const url = `https://web.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }

    async function guardarYenviar(linea, tipo, nombreLinea) {
      const inicio = document.getElementById(`${linea}_inicio`).value;
      const fin = document.getElementById(`${linea}_fin`).value;
      const responsable = document.getElementById(`${linea}_responsable`).value;

      const registro = {
        linea: nombreLinea,
        inicio: inicio || null,
        fin: fin || null,
        responsable: responsable || null,
        momento: tipo
      };

      const { error } = await supabase.from("produccion_camion").insert([registro]);
      if (error) {
        alert("Error al guardar en Supabase: " + error.message);
        return;
      }

      let mensaje = '';
      if (tipo === 'inicio') {
        mensaje = `🚀 *${nombreLinea}*\n🕒 Inicio: ${inicio}\n👤 Responsable: ${responsable}`;
      } else {
        mensaje = `✅ *${nombreLinea}*\n🕒 Término: ${fin}`;
      }

      abrirWhatsApp(mensaje);
    }
  </script>

</body>
</html>
