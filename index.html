<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VDC 360° - Producción Camión</title>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://uixxrniebjfsxgouqlzh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpeHhybmllYmpmc3hnb3VxbHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU4Njg4NzYsImV4cCI6MjA3MTQ0NDg3Nn0.Rds7LA448PbyVfEfKC-lT47YgRwNR3Hl12z0To_z-dg';
    const supabase = createClient(supabaseUrl, supabaseKey);

    async function guardarDatos(event) {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target).entries());

      const { error } = await supabase.from('produccion_camion').insert([data]);
      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        alert('Datos guardados con éxito');
        event.target.reset();
      }
    }

    window.guardarDatos = guardarDatos;
  </script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      color: #0a7a3b;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 800px;
      margin: auto;
      display: grid;
      gap: 10px;
    }
    input, select {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #0a7a3b;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Registro de Producción - VDC 360°</h1>
  <form onsubmit="guardarDatos(event)">
    <label>Fecha: <input type="date" name="fecha" required></label>
    <label>Hora apertura camión: <input type="time" name="hora_apertura"></label>
    <label>Hora cierre camión: <input type="time" name="hora_cierre"></label>

    <h3>Líneas de Producción</h3>
    <label>Línea 1 - Bofe/Corazón (Inicio): <input type="time" name="linea1_inicio"></label>
    <label>Responsable: <input type="text" name="linea1_responsable"></label>
    <label>Fin: <input type="time" name="linea1_fin"></label>

    <label>Línea 2 - Teleco (Inicio): <input type="time" name="linea2_inicio"></label>
    <label>Responsable: <input type="text" name="linea2_responsable"></label>
    <label>Fin: <input type="time" name="linea2_fin"></label>

    <label>Línea 3 - Cuajo (Inicio): <input type="time" name="linea3_inicio"></label>
    <label>Responsable: <input type="text" name="linea3_responsable"></label>
    <label>Fin: <input type="time" name="linea3_fin"></label>

    <label>Línea 4 - Libro (Inicio): <input type="time" name="linea4_inicio"></label>
    <label>Responsable: <input type="text" name="linea4_responsable"></label>
    <label>Fin: <input type="time" name="linea4_fin"></label>

    <label>Línea 5 - Menudo (Inicio): <input type="time" name="linea5_inicio"></label>
    <label>Responsable: <input type="text" name="linea5_responsable"></label>
    <label>Fin: <input type="time" name="linea5_fin"></label>

    <h3>Patas Sucias</h3>
    <label>Hora de envío a limpieza: <input type="time" name="patas_hora_envio"></label>
    <label>Hora de llegada post-limpieza: <input type="time" name="patas_hora_llegada"></label>

    <button type="submit">Guardar producción</button>
  </form>
</body>
</html>
