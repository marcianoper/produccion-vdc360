<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VDC 360° — Lavado de Patas</title>

  <style>
    :root{
      --brand:#0a7a3b;
      --brand2:#0f9a52;
      --bg:#f4f6f5;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --danger:#b91c1c;
      --shadow:0 14px 34px rgba(2,6,23,.10);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    header{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:white;
      padding:20px;
      box-shadow:var(--shadow);
    }

    header h1{
      margin:0;
      font-size:26px;
      font-weight:900;
    }

    header p{
      margin:6px 0 0;
      opacity:.92;
      font-size:14px;
    }

    main{
      max-width:1200px;
      margin:auto;
      padding:18px;
      display:grid;
      gap:18px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }

    .stat{
      background:white;
      border-radius:18px;
      border:1px solid var(--line);
      padding:18px;
      box-shadow:0 8px 24px rgba(15,23,42,.05);
    }

    .stat span{
      display:block;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .stat strong{
      display:block;
      margin-top:8px;
      font-size:28px;
      color:var(--brand);
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      box-shadow:0 8px 24px rgba(15,23,42,.06);
    }

    .card h2{
      margin:0 0 18px;
      font-size:22px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:800;
      color:var(--muted);
    }

    input,select{
      width:100%;
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      font-size:18px;
      background:white;
      color:var(--ink);
      outline:none;
    }

    input:focus,select:focus{
      border-color:var(--brand);
      box-shadow:0 0 0 4px rgba(10,122,59,.10);
    }

    .machine-grid{
      display:grid;
      gap:14px;
    }

    .machine{
      display:grid;
      grid-template-columns:1fr 1fr 1fr .8fr;
      gap:12px;
      align-items:end;
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
    }

    .machine-title{
      font-weight:900;
      color:var(--brand);
      padding-bottom:14px;
      font-size:17px;
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    button{
      border:0;
      border-radius:16px;
      padding:14px 18px;
      font-size:15px;
      font-weight:900;
      cursor:pointer;
      background:var(--brand);
      color:white;
      box-shadow:0 10px 22px rgba(10,122,59,.18);
    }

    button.secondary{
      background:#0f172a;
      box-shadow:0 10px 22px rgba(15,23,42,.16);
    }

    button.light{
      background:#e9f6ee;
      color:var(--brand);
      box-shadow:none;
      border:1px solid rgba(10,122,59,.14);
    }

    button.danger{
      background:var(--danger);
      box-shadow:0 10px 22px rgba(185,28,28,.18);
    }

    .message{
      background:#0f172a;
      color:white;
      border-radius:20px;
      padding:18px;
      min-height:280px;
      white-space:pre-wrap;
      line-height:1.6;
      font-size:15px;
    }

    @media(max-width:900px){

      .stats{
        grid-template-columns:1fr 1fr;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .machine{
        grid-template-columns:1fr;
      }

    }

    @media(max-width:600px){

      .stats{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

<header>
  <h1>🐾 VDC 360° — Lavado de Patas</h1>
  <p>Control de salida, llegada y descarga por máquina.</p>
</header>

<main>

  <section class="stats">

    <div class="stat">
      <span>Tiempo traslado</span>
      <strong id="statTraslado">0 min</strong>
    </div>

    <div class="stat">
      <span>Máquinas</span>
      <strong id="statMaquinas">0</strong>
    </div>

    <div class="stat">
      <span>Descarga total</span>
      <strong id="statDescarga">0 min</strong>
    </div>

    <div class="stat">
      <span>Duración general</span>
      <strong id="statGeneral">0 min</strong>
    </div>

  </section>

  <section class="card">

    <h2>Datos generales</h2>

    <div class="form-grid">

      <div>
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>

      <div>
        <label>Operador</label>
        <input type="text" id="operador" placeholder="Tatán">
      </div>

      <div>
        <label>Tipo de registro</label>
        <select id="tipoRegistro">
          <option value="Patas">Patas</option>
          <option value="Pata blanca">Pata blanca</option>
          <option value="Pata morena">Pata morena</option>
          <option value="Mixto">Mixto</option>
        </select>
      </div>

      <div>
        <label>Salida de bodega</label>
        <input type="time" id="salidaBodega">
      </div>

      <div>
        <label>Llegada a granja</label>
        <input type="time" id="llegadaGranja">
      </div>

      <div>
        <label>Hora de descarga</label>
        <input type="time" id="horaDescarga">
      </div>

    </div>

  </section>

  <section class="card">

    <h2>Descarga por máquina</h2>

    <div class="machine-grid" id="machines"></div>

    <div class="actions">
      <button onclick="agregarMaquina()">+ Agregar máquina</button>
      <button class="light" onclick="llenarEjemplo()">Llenar ejemplo</button>
      <button class="danger" onclick="limpiarTodo()">Limpiar</button>
    </div>

  </section>

  <section class="card">

    <h2>Reporte automático</h2>

    <div class="actions">
      <button onclick="generarReporte()">Generar mensaje</button>
      <button class="secondary" onclick="copiarMensaje()">Copiar WhatsApp</button>
      <button class="light" onclick="abrirWhatsApp()">Abrir WhatsApp</button>
    </div>

    <div class="message" id="mensaje">
Aquí aparecerá el reporte.
    </div>

  </section>

</main>

<script>

  let maquinas = 5;

  const $ = id => document.getElementById(id);

  function hoyISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function formatoFecha(fechaISO){
    if(!fechaISO) return '';
    const [y,m,d] = fechaISO.split('-');
    return `${d}/${m}/${y}`;
  }

  function minutosEntre(inicio,fin){

    if(!inicio || !fin) return 0;

    const [hi,mi] = inicio.split(':').map(Number);
    const [hf,mf] = fin.split(':').map(Number);

    let a = hi * 60 + mi;
    let b = hf * 60 + mf;

    if(b < a) b += 24 * 60;

    return b - a;
  }

  function horaBonita(hora){

    if(!hora) return '';

    let [h,m] = hora.split(':').map(Number);

    const ampm = h >= 12 ? 'p.m.' : 'a.m.';

    let h12 = h % 12;

    if(h12 === 0) h12 = 12;

    return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  function nombreMaquina(i){

    const nombres = [
      'Primera máquina',
      'Segunda máquina',
      'Tercera máquina',
      'Cuarta máquina',
      'Quinta máquina',
      'Sexta máquina',
      'Séptima máquina',
      'Octava máquina',
      'Novena máquina',
      'Décima máquina'
    ];

    return nombres[i-1] || `Máquina ${i}`;
  }

  function crearMaquinas(){

    const cont = $('machines');

    cont.innerHTML = '';

    for(let i=1;i<=maquinas;i++){

      const div = document.createElement('div');

      div.className = 'machine';

      div.innerHTML = `
        <div class="machine-title">${nombreMaquina(i)}</div>

        <div>
          <label>Inicio</label>
          <input type="time" id="maq${i}Inicio" oninput="actualizarStats()">
        </div>

        <div>
          <label>Fin</label>
          <input type="time" id="maq${i}Fin" oninput="actualizarStats()">
        </div>

        <div>
          <label>Minutos</label>
          <input type="text" id="maq${i}Min" readonly value="0 min">
        </div>
      `;

      cont.appendChild(div);
    }

  }

  function agregarMaquina(){

    maquinas++;

    crearMaquinas();

    actualizarStats();
  }

  function actualizarStats(){

    const traslado = minutosEntre(
      $('salidaBodega').value,
      $('llegadaGranja').value
    );

    let totalDescarga = 0;
    let registradas = 0;
    let ultimoFin = '';

    for(let i=1;i<=maquinas;i++){

      const inicio = $(`maq${i}Inicio`)?.value;
      const fin = $(`maq${i}Fin`)?.value;

      const min = minutosEntre(inicio,fin);

      if($(`maq${i}Min`)){
        $(`maq${i}Min`).value = `${min} min`;
      }

      if(inicio && fin){

        totalDescarga += min;
        registradas++;

        ultimoFin = fin;
      }

    }

    const general = minutosEntre(
      $('salidaBodega').value,
      ultimoFin
    );

    $('statTraslado').textContent = `${traslado} min`;
    $('statMaquinas').textContent = registradas;
    $('statDescarga').textContent = `${totalDescarga} min`;
    $('statGeneral').textContent = `${general} min`;

  }

  function generarReporte(){

    actualizarStats();

    const fecha = formatoFecha($('fecha').value);
    const operador = $('operador').value.trim();
    const tipo = $('tipoRegistro').value;
    const salida = $('salidaBodega').value;
    const llegada = $('llegadaGranja').value;
    const descarga = $('horaDescarga').value;

    const traslado = minutosEntre(salida,llegada);

    let totalDescarga = 0;
    let maquinasTexto = '';
    let registradas = 0;
    let primerInicio = '';
    let ultimoFin = '';

    for(let i=1;i<=maquinas;i++){

      const inicio = $(`maq${i}Inicio`)?.value;
      const fin = $(`maq${i}Fin`)?.value;

      if(inicio && fin){

        const min = minutosEntre(inicio,fin);

        totalDescarga += min;
        registradas++;

        if(!primerInicio){
          primerInicio = inicio;
        }

        ultimoFin = fin;

        maquinasTexto += `
${i}️⃣ *${nombreMaquina(i)}*
${horaBonita(inicio)} a ${horaBonita(fin)}
⏱️ ${min} minutos
`;

      }

    }

    const general = minutosEntre(salida,ultimoFin);

    const msg = `🐾 *REPORTE LAVADO DE PATAS*

📅 *Fecha:* ${fecha}
👤 *Operador:* ${operador}
📦 *Producto:* ${tipo}

🚚 *Salida de bodega:* ${horaBonita(salida)}
📍 *Llegada a granja:* ${horaBonita(llegada)}
⏱️ *Tiempo traslado:* ${traslado} min

📥 *Hora de descarga:* ${horaBonita(descarga)}

🧼 *DESCARGA EN MÁQUINAS*
${maquinasTexto}

📊 *Resumen*
• Máquinas cargadas: ${registradas}
• Tiempo total descarga: ${totalDescarga} min
• Inicio descarga: ${horaBonita(primerInicio)}
• Fin descarga: ${horaBonita(ultimoFin)}
• Duración general: ${general} min

— *Sistema VDC 360°*`;

    $('mensaje').textContent = msg;

  }

  async function copiarMensaje(){

    const texto = $('mensaje').textContent;

    await navigator.clipboard.writeText(texto);

    alert('Mensaje copiado.');
  }

  function abrirWhatsApp(){

    const texto = $('mensaje').textContent;

    const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;

    window.open(url,'_blank');
  }

  function limpiarTodo(){

    document.querySelectorAll('input').forEach(el => {

      if(el.type !== 'date'){
        el.value = '';
      }

    });

    $('mensaje').textContent = 'Aquí aparecerá el reporte.';

    $('fecha').value = hoyISO();

    actualizarStats();
  }

  function llenarEjemplo(){

    $('fecha').value = '2026-05-08';
    $('operador').value = 'Tatán';
    $('tipoRegistro').value = 'Patas';

    $('salidaBodega').value = '07:16';
    $('llegadaGranja').value = '07:36';
    $('horaDescarga').value = '07:36';

    $('maq1Inicio').value = '07:39';
    $('maq1Fin').value = '07:44';

    $('maq2Inicio').value = '07:45';
    $('maq2Fin').value = '07:48';

    $('maq3Inicio').value = '07:49';
    $('maq3Fin').value = '07:52';

    $('maq4Inicio').value = '07:53';
    $('maq4Fin').value = '07:57';

    $('maq5Inicio').value = '07:59';
    $('maq5Fin').value = '08:04';

    actualizarStats();

    generarReporte();
  }

  document.addEventListener('DOMContentLoaded',()=>{

    $('fecha').value = hoyISO();

    crearMaquinas();

    document.querySelectorAll('input,select').forEach(el => {

      el.addEventListener('input',actualizarStats);
      el.addEventListener('change',actualizarStats);

    });

  });

</script>

</body>
</html>
